{% extends "pointage/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 fw-bold mb-0">{{ titre }}</h1>
  <a class="btn btn-brand btn-sm" href="{% url url_create %}">+ Nouveau {{ singulier }}</a>
</div>
<div class="card-soft p-2" style="max-width:1000px">
<table class="table table-sm grid mb-0">
  <thead><tr>{% for e in entetes %}<th>{{ e }}</th>{% endfor %}<th></th></tr></thead>
  {% for o, vals in lignes %}<tr>{% for v in vals %}<td>{{ v }}</td>{% endfor %}
    <td class="text-center"><a href="{% url url_update o.pk %}">✎</a></td></tr>
  {% empty %}<tr><td colspan="{{ entetes|length|add:1 }}" class="text-muted">Aucun {{ singulier }}.</td></tr>{% endfor %}
</table></div>
{% endblock %}
